name: cursor
family: subprocess
transport: subprocess
# Structured envelope preserves any usage the CLI reports; absent usage stays unknown.
parse: cursor_json
promptDelivery: arg
commandTemplate:
  - cursor-agent
  - -p
  - --output-format
  - json
  # ask = read-only Q&A mode (no edits). `-p` alone would grant write+shell,
  # so --mode ask is the control here, mirroring codex's `-s read-only`.
  - --mode
  - ask
  # cursor-agent refuses to run non-interactively in an untrusted dir. --trust
  # scopes to the cwd only; it is NOT --yolo/-f (which would allow all commands).
  - --trust
  # belt-and-braces: explicitly pin the sandbox rather than inheriting config.
  - --sandbox
  - enabled
  # Project hooks (security review D, verified 2026-09-22): a .cursor/hooks.json
  # beforeSubmitPrompt/stop hook did not run under `-p --mode ask --trust`.
  # never add --approve-mcps: headless runs would then auto-approve every
  # configured MCP server for this read-only lane. Checked 2026-09-22 against
  # cursor-agent 2026.09.18: --approve-mcps is opt-in (default false) and there is
  # no per-run flag to disable MCP; only servers added with `cursor-agent mcp
  # enable` are pre-approved (`cursor-agent mcp list` showed none on this host).
  # No `--` here: `cursor-agent --help` does not document it as ending options,
  # so buildInvocation prefixes a space to a prompt that starts with '-'.
  - "{prompt}"
# Prefer the Cursor Models usage pool with Composer; third-party models use
# a separate allowance. Explicit --model IDs are passed through to Cursor.
model: composer-2.5
modelFlag: --model
models:
  flag: --model
  default: composer-2.5
  # Curated subset verified against `cursor-agent models` on 2026-09-09.
  # Keep one model per useful tier/job instead of mirroring the full catalog.
  # DELIBERATELY EXCLUDED: claude-fable-5-thinking-* — Cursor flags them "NO ZDR"
  # and Cursor is a third-party endpoint, so the Fable tier must not be reached
  # through here (see DECISION-RUBRIC §2/§3 third-party trust).
  options:
    # Lane policy: Cursor runs Composer only. GPT work goes to the codex/pi
    # lanes (Luna/Sol) and Claude work to the claude lane (Opus 5.5/Sonnet).
    - composer-2.5
    - composer-2.5-fast
# Native resume remains disabled; existing transcript fallback is unchanged.
session: null
healthProbe: [which, cursor-agent]
capabilities:
  canReadFiles: true
  canRunShell: false
  canModifyRepo: false
  canAccessNetwork: true
  canPublish: false
