name: cursor
family: subprocess
transport: subprocess
# Structured envelope preserves any usage the CLI reports; absent usage stays unknown.
parse: cursor_json
promptDelivery: arg
commandTemplate:
  - cursor-agent
  - -p
  - --output-format
  - json
  # ask = read-only Q&A mode (no edits). `-p` alone would grant write+shell,
  # so --mode ask is the control here, mirroring codex's `-s read-only`.
  - --mode
  - ask
  # cursor-agent refuses to run non-interactively in an untrusted dir. --trust
  # scopes to the cwd only; it is NOT --yolo/-f (which would allow all commands).
  - --trust
  # belt-and-braces: explicitly pin the sandbox rather than inheriting config.
  - --sandbox
  - enabled
  - "{prompt}"
# Prefer the Cursor Models usage pool with Composer; third-party models use
# a separate allowance. Explicit --model IDs are passed through to Cursor.
model: composer-2.5
modelFlag: --model
models:
  flag: --model
  default: composer-2.5
  # Curated subset verified against `cursor-agent models` on 2026-09-09.
  # Keep one model per useful tier/job instead of mirroring the full catalog.
  # DELIBERATELY EXCLUDED: claude-fable-5-thinking-* — Cursor flags them "NO ZDR"
  # and Cursor is a third-party endpoint, so the Fable tier must not be reached
  # through here (see DECISION-RUBRIC §2/§3 third-party trust).
  options:
    - composer-2.5
    - composer-2.5-fast
    - muse-spark-1.3-minimal
    - gemini-3.8-flash-low
    - gpt-5.6-luna-high
    - gpt-5.6-terra-high
    - gpt-5.6-sol-high
    - claude-sonnet-5-thinking-high
    - claude-opus-5-thinking-high
    - gpt-5.3-codex
    - cursor-grok-4.6-high-fast
# Native resume remains disabled; existing transcript fallback is unchanged.
session: null
healthProbe: [which, cursor-agent]
capabilities:
  canReadFiles: true
  canRunShell: false
  canModifyRepo: false
  canAccessNetwork: true
  canPublish: false
