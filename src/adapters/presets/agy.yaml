name: agy
family: subprocess
adapter: agy
transport: subprocess
parse: agy_json
optional: true
promptDelivery: arg
promptPrefix: |-
  For current or online facts, use the built-in web search tool directly and
  include source URLs in the final answer. Never run Bash, terminal, or any
  command. If the request asks for image generation or editing, use the
  nanobanana MCP tools directly and report the generated file path(s). Return
  only the final answer for the user.

  User task:


# `agy --help` (1.2.7): --sandbox is a boolean "Run in a sandbox with terminal
# restrictions enabled" and enforces the no-terminal rule above. Needs
# confirmation: agy has no per-run tool allowlist or MCP-disable flag (`agy mcp`
# only edits config), so this canWriteFiles lane stays behind the approval
# capability gate.
commandTemplate:
  - agy
  - --prompt
  - "{prompt}"
  - --sandbox
  - --output-format
  - json
# Native Antigravity conversations can be resumed by id when callers opt into
# agentctl sessions; without --session, every call remains an independent turn.
session:
  supportsResume: true
  idFrom: agy_conversation
  resumeStyle: append_flag
  resumeFlag: --conversation
healthProbe: [which, agy]
capabilities:
  canReadFiles: true
  canWriteFiles: true
  canRunShell: false
  canAccessNetwork: true
  canUseBrowser: false
  canModifyRepo: false
  canPublish: false
