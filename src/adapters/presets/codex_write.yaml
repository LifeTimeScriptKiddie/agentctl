name: codex_write
family: subprocess
transport: subprocess
parse: codex_lastmsg
# One ChatGPT login backs codex and codex_write, so a usage cap on one caps both.
quotaAccount: codex
# Explicit repository-editing lane. Keep the ordinary `codex` preset read-only;
# callers must opt into this preset and pin workdir to an isolated worktree.
promptDelivery: stdin
commandTemplate:
  - codex
  - exec
  - --json
  - --skip-git-repo-check
  - -s
  - workspace-write
model: gpt-5.6-luna
modelFlag: -m
effort:
  flag: -c
  key: model_reasoning_effort
  default: max
  options: [minimal, low, medium, high, max]
models:
  flag: -m
  default: gpt-5.6-luna
  options: [gpt-5.6-luna, gpt-5.6-sol, gpt-daybreak-blue-latest]
healthProbe: [which, codex]
capabilities:
  canReadFiles: true
  canRunShell: true
  canModifyRepo: true
  canPublish: false
