name: comet
family: browser
transport: browser
setupHint: "Run `agentctl comet setup` to sign in to Perplexity once in the dedicated browser. Optional."
parse: text
optional: true
# Drives perplexity.ai in a dedicated, Playwright-controlled browser. NOTE: Comet
# disables the browser-context CDP methods Playwright needs, so connectOverCDP
# can't attach to it — we drive Google Chrome instead (same Perplexity result;
# the adapter uses no Comet-specific features). Read-only / evidence role.
# null → managed instance: Chrome picks a free loopback port, recorded in the
# (0700) profile's DevToolsActivePort file and verified before attaching. Set an
# explicit endpoint (e.g. "http://127.0.0.1:9333") in your own agents.yaml only
# to attach to a browser you started on that fixed port yourself.
cdpEndpoint: null
# Auto-launch a dedicated Chrome instance (separate profile + debug port) if none
# is reachable — so you never touch your main browser. Log into Perplexity once
# in the managed window; the profile persists.
autoLaunch: false
appName: Google Chrome
userDataDir: null   # → ~/.agentctl/chrome-profile
capabilities:
  canReadFiles: false
  canWriteFiles: false
  canRunShell: false
  canAccessNetwork: true
  canUseBrowser: true
  canModifyRepo: false
  canPublish: false
