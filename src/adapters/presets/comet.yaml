name: comet
family: browser
transport: browser
setupHint: "Run `agentctl comet setup` to sign in to Perplexity once in the dedicated browser. Optional."
parse: text
optional: true
# Drives perplexity.ai in a dedicated, Playwright-controlled Comet instance.
# Earlier Comet builds blocked the CDP methods Playwright needs, so this lane
# used Google Chrome; Comet 153 attaches fine (verified 2026-09-29:
# connectOverCDP, newPage, perplexity.ai load). To go back to Chrome, set
# `appName: Google Chrome` for comet in your own agents.yaml. Read-only / evidence role.
# null → managed instance: Chrome picks a free loopback port, recorded in the
# (0700) profile's DevToolsActivePort file and verified before attaching. Set an
# explicit endpoint (e.g. "http://127.0.0.1:9333") in your own agents.yaml only
# to attach to a browser you started on that fixed port yourself.
cdpEndpoint: null
# Auto-launch a dedicated Comet instance (separate profile + debug port) if none
# is reachable — so you never touch your main Comet window. Log into Perplexity
# once in the managed window; the profile persists.
autoLaunch: false
appName: Comet
userDataDir: null   # → ~/.agentctl/comet-profile (Chrome: chrome-profile)
capabilities:
  canReadFiles: false
  canWriteFiles: false
  canRunShell: false
  canAccessNetwork: true
  canUseBrowser: true
  canModifyRepo: false
  canPublish: false
